<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UNDEATH KNIGHT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="rotate-overlay">Putar perangkat Anda ke mode landscape 🔄</div>

<audio id="bgm" src="https://files.catbox.moe/h33zn9.mp3" loop preload="auto"></audio>

<section id="title-screen" class="screen active" style="background-image:url('https://files.catbox.moe/ilcs68.png')">
  <div class="title-overlay">
    <button id="mute-btn" class="btn-mute" title="Mute/Unmute">🔊</button>
    <h1 class="game-title">UNDEATH KNIGHT</h1>
    <button id="play-btn" class="btn-play">▶ PLAY</button>
    <p class="credit">Credit: ZEPARDON DECODE</p>
  </div>
</section>

<section id="map-select-screen" class="screen">
  <h2 class="select-title">PILIH MEDAN PERTEMPURAN</h2>
  <div class="carousel" id="carousel">
    <div class="carousel-track" id="carousel-track">
      <div class="map-card" data-map="grave.html" style="background-image:url('https://files.catbox.moe/4tfxlu.png')">
        <div class="map-label">GRAVE<span>Boss: Big Zombie</span></div>
      </div>
      <div class="map-card" data-map="snow.html" style="background-image:url('https://files.catbox.moe/rqfw3a.png')">
        <div class="map-label">SNOW MOUNTAIN<span>Boss: Rubah Ekor Sembilan</span></div>
      </div>
    </div>
  </div>
  <div class="dots" id="dots">
    <span class="dot active" data-i="0"></span>
    <span class="dot" data-i="1"></span>
  </div>
  <button id="ok-btn" class="btn-ok">OK</button>
</section>

<script>
  const bgm = document.getElementById("bgm");
  bgm.volume = 0.55;
  const muteBtn = document.getElementById("mute-btn");
  let muted = false;
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    bgm.muted = muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  function tryPlayMusic() {
    bgm.play().catch(() => {
      // Autoplay blocked until user gesture; will retry on next interaction.
      document.addEventListener("pointerdown", () => bgm.play().catch(() => {}), { once: true });
    });
  }
  tryPlayMusic();

  const titleScreen = document.getElementById("title-screen");
  const mapScreen = document.getElementById("map-select-screen");
  document.getElementById("play-btn").addEventListener("click", () => {
    tryPlayMusic();
    titleScreen.classList.remove("active");
    mapScreen.classList.add("active");
  });

  // --- Swipe carousel ---
  const track = document.getElementById("carousel-track");
  const cards = document.querySelectorAll(".map-card");
  const dots = document.querySelectorAll(".dot");
  let current = 0;
  let startX = 0, dragging = false, dragOffset = 0;
  const carousel = document.getElementById("carousel");

  function goTo(i) {
    current = Math.max(0, Math.min(cards.length - 1, i));
    track.style.transform = "translateX(-" + current * 100 + "%)";
    dots.forEach((d, idx) => d.classList.toggle("active", idx === current));
  }

  carousel.addEventListener("pointerdown", (e) => {
    dragging = true; startX = e.clientX; dragOffset = 0;
    track.style.transition = "none";
  });
  window.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dragOffset = e.clientX - startX;
    const pct = (dragOffset / carousel.clientWidth) * 100;
    track.style.transform = "translateX(calc(-" + current * 100 + "% + " + dragOffset + "px))";
  });
  window.addEventListener("pointerup", () => {
    if (!dragging) return;
    dragging = false;
    track.style.transition = "transform 0.35s ease";
    if (dragOffset < -60) goTo(current + 1);
    else if (dragOffset > 60) goTo(current - 1);
    else goTo(current);
  });

  dots.forEach((d) => d.addEventListener("click", () => goTo(parseInt(d.dataset.i, 10))));

  document.getElementById("ok-btn").addEventListener("click", () => {
    const map = cards[current].dataset.map;
    window.location.href = map;
  });
</script>
</body>
</html>
